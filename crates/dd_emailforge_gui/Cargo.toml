[package]
name = "dd_emailforge_gui"
version = "0.9.10"
edition = "2024"
license = "MIT"
publish = false
description = "GPUI frontend for dd_emailforge"

[[bin]]
name = "dd_emailforge-gui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
dd_emailforge = { path = "../.." }
gpui = { package = "gpui-pre", version = "=0.3.12" }
# Linux windows need a backend. wayland and x11 are off by default.
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.12", features = [
    "wayland",
    "x11",
] }
gpui_macros = { package = "gpui-pre-macros", version = "=0.3.12" }
gpui-component = { version = "=0.9.1" }
ldnddev_theme = { path = "../ldnddev_theme" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
gpui = { package = "gpui-pre", version = "=0.3.12", features = ["test-support"] }
tempfile = "3"
