[package]
name = "dd_emailforge"
version = "0.8.0"
edition = "2024"
license = "MIT"
description = "Terminal-UI email template builder (MJML 5)"

[workspace]
members = ["crates/ldnddev_theme"]

[profile.release]
opt-level = "z" # measured smaller than "s" (1.7M vs 2.0M)
lto = true
codegen-units = 1
panic = "abort"
strip = true
debug = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", default-features = false, features = [
    "std",
    "derive",
    "help",
    "usage",
    "error-context",
] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ldnddev_theme = { path = "crates/ldnddev_theme" }
