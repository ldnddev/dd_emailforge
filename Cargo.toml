[package]
name = "dd_emailforge"
version = "0.7.0"
edition = "2024"
license = "MIT"
description = "Terminal-UI email template builder (MJML 5)"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = "0.29"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
ldnddev_theme = { path = "vendor/ldnddev_theme" }
